<!DOCTYPE html>
<html>
<head>
    <title>Employee Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid #333;
            margin: 30px auto;
            background-color: lightblue;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="card">

        <h2>Employee Details</h2>

        <p>Name: Vaibhav</p>

        <p>Department: Development</p>

        <p>Status: Active</p>

    </div>

</body>
</html>
